name: build-site

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.mjs, 'public/**']   # 파비콘 등 정적 파일이나 빌드 스크립트를 올리면 바로 재빌드

permissions:
  contents: write

concurrency: build-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate docs/
        run: node build.mjs
        env:
          BUILD_KEY: ${{ secrets.BUILD_KEY }}
          SITE_URL: https://powerfulh.github.io/curtain-community
      - name: Publish to pages branch (single commit, no history)
        run: |
          mkdir /tmp/site && cp -r docs /tmp/site/docs && cd /tmp/site
          git init -q -b pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build $(date -u +%F)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin pages
